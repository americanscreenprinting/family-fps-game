<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>District Fire — Family FPS</title>
  <link rel="stylesheet" href="/css/style.css" />
  <script src="/socket.io/socket.io.js"></script>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
    }
  }
  </script>
</head>
<body>
  <div id="lobby" class="panel">
    <h1>DISTRICT FIRE</h1>
    <p class="tagline">Tactical arena · Free-for-all · Max 3</p>
    <label>Callsign
      <input id="nameInput" maxlength="12" placeholder="Your name" autocomplete="off" />
    </label>
    <div class="row">
      <button id="btnCreate" class="primary">Create Room</button>
    </div>
    <div class="row">
      <button id="btnPractice" class="primary practice">Practice vs bots</button>
    </div>
    <div class="row join-row">
      <input id="codeInput" maxlength="4" placeholder="CODE" autocomplete="off" class="code" />
      <button id="btnJoin">Join</button>
    </div>
    <p id="lobbyError" class="error"></p>
    <div id="lobbyRoom" class="hidden">
      <p>Room <strong id="roomCode"></strong></p>
      <p class="hint">Share this code · same Wi‑Fi or this link</p>
      <ul id="playerList"></ul>
      <label class="limit-row">Kill limit
        <input id="killLimit" type="number" min="3" max="30" value="10" />
      </label>
      <button id="btnReady" class="primary">Ready</button>
      <p id="waiting" class="hint">Waiting for 2–3 players, all Ready…</p>
    </div>
  </div>

  <div id="hud" class="hidden">
    <div id="crosshair"></div>
    <div id="topBar">
      <span id="hpBar"><i id="hpFill"></i></span>
      <span id="ammo">30 | 90</span>
      <span id="scoreTiny"></span>
    </div>
    <div id="killFeed"></div>
    <div id="scoreboard"></div>
    <div id="respawnMsg" class="hidden">Respawning…</div>
    <div id="winnerMsg" class="hidden">
      <h2 id="winnerText"></h2>
      <button id="btnRestart">Back to Lobby</button>
    </div>
  </div>

  <!-- Touch controls -->
  <div id="touchUI" class="hidden">
    <div id="joyZone">
      <div id="joyBase"><div id="joyKnob"></div></div>
    </div>
    <div id="lookZone"></div>
    <button id="btnFire" class="touchBtn">FIRE</button>
    <button id="btnJump" class="touchBtn">JUMP</button>
    <button id="btnReload" class="touchBtn small">R</button>
  </div>

  <canvas id="game"></canvas>
  <script type="module" src="/js/game.js"></script>
</body>
</html>
